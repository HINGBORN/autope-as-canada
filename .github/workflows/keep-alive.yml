name: Bot Keep-Alive Render (Auto Peças Canadá)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Ping para o servidor no Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://autopecascanada.onrender.com/)
          echo "Status do Render: $STATUS"

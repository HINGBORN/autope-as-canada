name: app_scanner_autopecas
description: Aplicativo Android em Flutter para leitura de QR Code e cadastro de peças da Canada Auto Peças.
publish_to: 'none'
version: 1.2.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  qr_code_scanner_plus: ^2.0.6
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
